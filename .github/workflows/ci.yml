name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: pytest --cov --cov-report=term-missing
      - run: >-
          python -m benchmarks.run --disable-nlp
          --dataset benchmarks/datasets/synthetic-v1.jsonl
          --output build/benchmark-report-rules.json
          --fail-under-recall 0.95
          --fail-under-core-zero-miss-rate 0.95
          --fail-under-hard-negative-pass-rate 1.00
      - run: >-
          python -m benchmarks.run
          --dataset benchmarks/datasets/synthetic-v1.jsonl
          --output build/benchmark-report-ginza.json
          --fail-under-recall 0.99
          --fail-under-core-zero-miss-rate 0.99
          --fail-under-hard-negative-pass-rate 0.99
      - run: python scripts/check_licenses.py
      - run: docker build -t kotoba-veil:test .
