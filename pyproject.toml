[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kotoba-veil"
version = "0.1.0"
description = "Local-first Japanese PII review and masking application"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "python-multipart==0.0.20",
  "pydantic==2.11.4",
  "presidio-analyzer==2.2.358",
  "spacy==3.7.5",
  "ginza==5.2.0",
  "ja-ginza==5.2.0",
  "python-docx==1.1.2",
  "python-pptx==1.0.2",
  "pypdf==5.4.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "pytest-cov==6.1.1",
  "pip-licenses==5.0.0",
]

[project.scripts]
kotoba-veil-benchmark = "benchmarks.run:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*", "benchmarks*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
