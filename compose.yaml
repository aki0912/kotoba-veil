services:
  kotoba-veil:
    image: kotoba-veil:local
    build: .
    ports:
      - "8000:8000"
    volumes:
      - kotoba-veil-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  kotoba-veil-data:
